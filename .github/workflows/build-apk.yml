name: Build ANIMANIA! Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "native-game/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.6"
          neko-version: "2.3.0"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet

      - name: Set up Lime for Android
        shell: bash
        run: |
          printf 'n\nn\nn\n%s\n%s\n%s\n' "$ANDROID_HOME" "$ANDROID_HOME/ndk/21.4.7075529" "$JAVA_HOME" | haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Prepare app icon from animania-assets repository
        shell: bash
        run: |
          mkdir -p native-game/assets
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gonjohan6-dotcom/animania-assets/main/appIcon.png \
            --output /tmp/animania-appIcon.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          source = Image.open("/tmp/animania-appIcon.png").convert("RGBA")
          # Keep the full original artwork visible inside a square Android icon.
          source.thumbnail((460, 460), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (12, 12, 16, 255))
          x = (512 - source.width) // 2
          y = (512 - source.height) // 2
          canvas.alpha_composite(source, (x, y))
          canvas.save("native-game/assets/icon.png", "PNG")
          print(f"Prepared 512x512 app icon from source {Image.open('/tmp/animania-appIcon.png').size}")
          PY

      - name: Build native Android game
        run: haxelib run lime build native-game/Project.xml android -debug

      - name: Find and name APK
        shell: bash
        run: |
          APK="$(find native-game/export -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Lime did not produce an APK. Check the build logs above."
            exit 1
          fi
          cp "$APK" "ANIMANIA! - ANDROID PORT.apk"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: ANIMANIA-NATIVE-ANDROID-PORT-APK
          path: "ANIMANIA! - ANDROID PORT.apk"
          if-no-files-found: error
