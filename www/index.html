<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>Mi Aplicacion</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101014; color: #f5f5f7; }
    main { width: min(90%, 520px); padding: 28px; border: 1px solid #303039; border-radius: 22px; background: #19191f; text-align: center; }
    h1 { margin-top: 0; }
    p { color: #c4c4ce; line-height: 1.6; }
    button { border: 0; border-radius: 12px; padding: 12px 18px; color: white; background: #6255e7; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Mi Aplicacion</h1>
    <p>El proyecto Android está conectado. Aquí podrás colocar tu HTML, CSS, JavaScript e imágenes.</p>
    <button id="test">Probar aplicación</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('test').addEventListener('click', () => {
      document.getElementById('message').textContent = '¡Funciona correctamente!';
    });
  </script>
</body>
</html>
